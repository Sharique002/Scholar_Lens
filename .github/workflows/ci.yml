name: Scholar Lens CI

on:
  push:
    branches: [ main, scholar_lens_engineering_audit, develop ]
  pull_request:
    branches: [ main, scholar_lens_engineering_audit ]

jobs:
  test-and-verify:
    name: Django Quality Gates & Automated Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: scholar_lens_test
          POSTGRES_USER: scholar_lens
          POSTGRES_PASSWORD: scholar_lens_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django System Check
        run: |
          python manage.py check

      - name: Check for Missing Migrations
        run: |
          python manage.py makemigrations --check --dry-run

      - name: Verify Static Files Collection
        run: |
          python manage.py collectstatic --no-input

      - name: Verify Production Deployment Security Check
        env:
          DEBUG: 'False'
          SECRET_KEY: 'ci-temporary-secure-deployment-check-key-minimum-32-chars'
          ALLOWED_HOSTS: 'localhost,127.0.0.1,scholar-lens.onrender.com'
          DATABASE_URL: 'postgresql://scholar_lens:scholar_lens_password@localhost:5432/scholar_lens_test'
        run: |
          python manage.py check --deploy

      - name: Run Unit and Integration Tests
        env:
          DEBUG: 'True'
          SECRET_KEY: 'test-secret-key-for-continuous-integration-pipeline-32chars'
          DATABASE_URL: 'postgresql://scholar_lens:scholar_lens_password@localhost:5432/scholar_lens_test'
        run: |
          python manage.py test --verbosity=2

  docker-verify:
    name: Docker Container Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: scholar-lens:test
