databases:
  - name: scholar-lens-db
    databaseName: scholar_lens
    user: scholar_lens
    plan: free

services:
  - type: web
    name: scholar-lens
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn scholar_lens.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 120"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: scholar-lens-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: "*.onrender.com,localhost,127.0.0.1"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: SERPAPI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
    disk:
      name: scholar-lens-media
      mountPath: /opt/render/project/src/media
      sizeGB: 1
