databases:
  - name: scholar-lens-db
    databaseName: scholar_lens
    user: scholar_lens
    plan: free

services:
  - type: web
    name: scholar-lens
    runtime: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "gunicorn scholar_lens.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: scholar-lens-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com,scholar-lens.onrender.com,localhost,127.0.0.1"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com,https://scholar-lens.onrender.com"
      - key: SERPAPI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
