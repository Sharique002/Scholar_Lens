version: '3.8'

services:
  staging_db:
    image: postgres:16-alpine
    container_name: scholar_lens_staging_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: scholar_lens_stg
      POSTGRES_USER: scholar_lens_stg
      POSTGRES_PASSWORD: scholar_lens_stg_password
    volumes:
      - staging_pg_data:/var/lib/postgresql/data
      - ./deploy/staging-init-db.sql:/docker-entrypoint-initdb.d/01-init-extensions.sql:ro
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scholar_lens_stg -d scholar_lens_stg"]
      interval: 5s
      timeout: 5s
      retries: 5

  staging_web:
    image: scholar-lens:staging-baseline
    container_name: scholar_lens_staging_web
    restart: unless-stopped
    depends_on:
      staging_db:
        condition: service_healthy
    environment:
      - SECRET_KEY=staging-verification-secret-key-32chars-min-length-institutional
      - DEBUG=False
      - USE_POSTGRES=True
      - DATABASE_URL=postgres://scholar_lens_stg:scholar_lens_stg_password@staging_db:5432/scholar_lens_stg_e2e
      - ALLOWED_HOSTS=localhost,127.0.0.1,staging_web,0.0.0.0
      - CSRF_TRUSTED_ORIGINS=http://localhost:8000,http://127.0.0.1:8000
      - SECURE_SSL_REDIRECT=False
      - SESSION_COOKIE_SECURE=False
      - CSRF_COOKIE_SECURE=False
      - SITE_NAME=Scholar Lens (Staging)
      - SITE_URL=http://localhost:8000
      - E2E=True
      - PORT=8000
    volumes:
      - staging_media_data:/app/media
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  staging_pg_data:
  staging_media_data:
